syntax = "proto3";

package airpurifier.v1;

option go_package = "eco-knock-be-embedded/internal/grpc/pb/airpurifier/v1;airpurifierpb";

import "google/protobuf/wrappers.proto";

message GetCurrentAirPurifierRequest {}

message GetCurrentAirPurifierResponse {
  string power = 1;
  bool is_on = 2;
  int32 aqi = 3;
  int32 average_aqi = 4;
  int32 humidity = 5;
  google.protobuf.DoubleValue temperature_c = 6;
  string mode = 7;
  int32 favorite_level = 8;
  int32 filter_life_remaining = 9;
  int32 filter_hours_used = 10;
  int32 motor_speed = 11;
  int32 purify_volume = 12;
  bool led = 13;
  google.protobuf.Int32Value led_brightness = 14;
  google.protobuf.BoolValue buzzer = 15;
  bool child_lock = 16;
  int64 measured_at_unix_ms = 17;
}

message SetAirPurifierPowerRequest {
  bool on = 1;
}

message SetAirPurifierModeRequest {
  string mode = 1;
}

message SetAirPurifierFavoriteLevelRequest {
  int32 level = 1;
}

message SetAirPurifierControlResponse {
  GetCurrentAirPurifierResponse current = 1;
}

service AirPurifierService {
  rpc GetCurrentAirPurifier(GetCurrentAirPurifierRequest) returns (GetCurrentAirPurifierResponse);
  rpc SetAirPurifierPower(SetAirPurifierPowerRequest) returns (SetAirPurifierControlResponse);
  rpc SetAirPurifierMode(SetAirPurifierModeRequest) returns (SetAirPurifierControlResponse);
  rpc SetAirPurifierFavoriteLevel(SetAirPurifierFavoriteLevelRequest) returns (SetAirPurifierControlResponse);
}
